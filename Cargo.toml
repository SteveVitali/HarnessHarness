# HarnessHarness — E1 kernel/helper ecosystem workspace (bound at Stage 0 by ADR-0050 (e)).
# CC4: the spec/contracts name no language; this workspace is the *build* binding of the E1
# candidate (compiled, memory-safe systems ecosystem) and is the one place, alongside the
# build ADRs, that names it concretely. Hermetic: pure standard library, no external crates,
# so the toolchain, CI and the Stage-0 boundary spike run offline and reproducibly.
[workspace]
resolver = "2"
members = [
    "crates/hh-wire",
    "crates/hh-embed-schema",
    # The C0/Stage-1 ontology and formal model (spec §2, R-2.1.1; ticket S1.1). A PERSISTENT
    # workspace member (not a throwaway like hh-baseline): the home table, the formal-model
    # symbol registry, κ + both configuration ids, participant classes, the compliance chain
    # schema, the compatibility-surface shape and the §2.9.2 acceptance checks.
    "crates/hh-ontology",
    # The C0/Stage-1 identity/versioning/artifact-identity model (spec §8.3, R-2.12.1; ticket
    # S1.2). A PERSISTENT workspace member: idp/1, ContentAddress, VersionedRef, the five
    # identity kinds, address/identify/verify over the ONE canonicalizer (CC1 anchors here),
    # configuration ids, single-namespace publish/resolve, supersede/revoke, StaleIndex, the
    # sameness ladder and reproducibility levels. The single schema source for identity (CC7).
    "crates/hh-identity",
    # The C0/Stage-1 provenance & authority model (spec §8.1, R-2.1.5; ticket S1.3). A
    # PERSISTENT workspace member: the ONE canonical ProvenanceRecord + Label lattice, the
    # seven-class AuthorityClass order, default_authority (conferred, never read — CC1/CC2),
    # join/meet/leq, R-TEXT, ledger stamping, propagation P1/P6/P7 + RP, the seal/endorse/
    # declassify basis, and monitor checks 1/2/5/7. hh-identity consumes the canonical record
    # (DF-S1.2-1); the single schema source for provenance (CC7).
    "crates/hh-provenance",
    "crates/hh-kernel",
    "crates/hh-codegen",
    "crates/hh-embed-client-generated",
    # THROWAWAY Stage-0 baseline (doc 3 §11.0; ticket S0.2). A workspace member so its
    # acceptance tests run under `cargo test --workspace`, but NOT a dependency of the kernel:
    # deleting `crates/hh-baseline` at the Stage-0 boundary breaks nothing persistent.
    "crates/hh-baseline",
]
# Throwaway spike trees (ADR-0050 R1–R6; doc 3 §11.0) live outside the workspace: they build
# against the persistent kernel but are never a build dependency of it.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"

[profile.release]
opt-level = 3
