# HarnessHarness — E1 kernel/helper ecosystem workspace (bound at Stage 0 by ADR-0050 (e)).
# CC4: the spec/contracts name no language; this workspace is the *build* binding of the E1
# candidate (compiled, memory-safe systems ecosystem) and is the one place, alongside the
# build ADRs, that names it concretely. Hermetic: pure standard library, no external crates,
# so the toolchain, CI and the Stage-0 boundary spike run offline and reproducibly.
[workspace]
resolver = "2"
members = [
    "crates/hh-wire",
    "crates/hh-embed-schema",
    # The C0/Stage-1 ontology and formal model (spec §2, R-2.1.1; ticket S1.1). A PERSISTENT
    # workspace member (not a throwaway like hh-baseline): the home table, the formal-model
    # symbol registry, κ + both configuration ids, participant classes, the compliance chain
    # schema, the compatibility-surface shape and the §2.9.2 acceptance checks.
    "crates/hh-ontology",
    # The C0/Stage-1 identity/versioning/artifact-identity model (spec §8.3, R-2.12.1; ticket
    # S1.2). A PERSISTENT workspace member: idp/1, ContentAddress, VersionedRef, the five
    # identity kinds, address/identify/verify over the ONE canonicalizer (CC1 anchors here),
    # configuration ids, single-namespace publish/resolve, supersede/revoke, StaleIndex, the
    # sameness ladder and reproducibility levels. The single schema source for identity (CC7).
    "crates/hh-identity",
    # The C0/Stage-1 provenance & authority model (spec §8.1, R-2.1.5; ticket S1.3). A
    # PERSISTENT workspace member: the ONE canonical ProvenanceRecord + Label lattice, the
    # seven-class AuthorityClass order, default_authority (conferred, never read — CC1/CC2),
    # join/meet/leq, R-TEXT, ledger stamping, propagation P1/P6/P7 + RP, the seal/endorse/
    # declassify basis, and monitor checks 1/2/5/7. hh-identity consumes the canonical record
    # (DF-S1.2-1); the single schema source for provenance (CC7).
    "crates/hh-provenance",
    # The C0/Stage-1 Harness IR (spec §3.1, R-2.1.2; ticket S1.4). A PERSISTENT workspace
    # member: the HIR/1 dialect — thirteen entity kinds, two opaque leaves, seven edge kinds,
    # a provenance + version record on every node and edge; validate/canonicalize/identity/
    # seal/diff/apply/invert/classify, migrate (identity), project, OpaqueProcess, and the
    # canonical-bytes seam (hh-ir-op) for out-of-process execution. Sits above ontology /
    # identity / provenance / wire; no Hosting ABI dependency (AC-IR-04).
    "crates/hh-hir",
    # The C0/Stage-1 event store / run ledger (spec §5a.1, R-2.2.1; ticket S1.5). A
    # PERSISTENT workspace member: the sole authoritative run record — the typed
    # append-only hash-chained event log (envelope + id model + the one declared
    # persistence-policy table), the content-addressed blob store, the immutable run
    # manifest, the single fenced writer, durable-before-visible commits, verify →
    # Tampered, and the rebuildable context_view/run_summary projections. Sits above
    # ontology/identity/provenance/wire; hashing through hh-identity (CC1), provenance
    # through hh-provenance, home planes through hh-ontology (CC10).
    "crates/hh-ledger",
    # The C0/Stage-1 resource-economics & accounting model (spec §8.2, R-2.1.6; ticket S1.6).
    # A PERSISTENT workspace member: the single schema source for resource quantities /
    # usage mappings / attribution / pricing tables / spend rows, the `control.budget.*` +
    # `measurement.cost.attributed` payload builders, the budget-tree projection (dynamic
    # containment, slice/pool, reservations, E1–E5), `cost_totals`, `MatchSpec` /
    # `search_budget` / `eval_budget` and the budget_delta governance gate. The closed
    # `DimensionId` registry itself lives in hh-ontology (the vocabulary crate) so hh-hir
    # can check bound keys — this crate is the accounting layer over it (CC7).
    "crates/hh-budget",
    # The C0/Stage-1 control plane (spec §5e.1/§5e.2, R-2.6.1/R-2.6.2; ticket
    # S1.20). A PERSISTENT workspace member: the `control_strategy` contract
    # (closed Cue/ControlDecision/ControlState sums, open/observe/decide/
    # terminate/checkpoint/restore, react/minimal + the variant registry), the
    # control envelope (EnvelopePolicy + the six guards + stop/drain +
    # retry/timeout/reservation sizing + INV-1…9 + the deterministic
    # loop_detector ladder + strict output validation), and the cue-inbox
    # driver that emits the full `control.decision` row with `checkpoint_ref`
    # and resumes by leaf. The control-plane `StopReason` sum is owned by
    # `hh_ontology::control` (ADR-0106 D6; CC7).
    "crates/hh-control",
    # The C0/Stage-1 component-variation registry *store* (spec §6.2, R-2.10.2⁰;
    # ticket S1.8). A PERSISTENT workspace member: the closed registry/1 record
    # kinds + the one RegistryEnvelope (three status axes), the hh/ + local/
    # namespaces, register/publish/resolve/snapshot/verify/lineage (+ the
    # deterministic query/slot_choices/substitutable projections AC-1 names), the
    # two Stage-1 ClassRecords + ConformanceSuites, and the lifecycle.registry.*
    # event classes. The store reuses the ONE identity/namespace scheme
    # (hh-identity, CC1) and appends through the run's single fenced writer
    # (hh-ledger). The C1 registry *service* is S4.1 — never this crate.
    "crates/hh-registry",
    # The C0/Stage-1 configuration & composition model (spec §3.3, R-2.1.4; ticket S1.9).
    # A PERSISTENT workspace member: the assembly grammar in the HIR/1 schema, the class
    # catalog for the two Stage-1 classes over the registry's ClassRecord/VariantRecord,
    # load / validate_assembly (stages 1–5, 7 — complete reports) / resolve (the ONE
    # resolver feeding hh-hir's seal — CF-056) / identity / diff-via-HirDiff / in-process
    # instantiate / verify_resume, and the closed AssemblyDiagnostic taxonomy. Sits above
    # hh-hir, hh-registry and hh-ledger; compose/space/enumerate are Stage 3.
    "crates/hh-assembly",
    # The C0/Stage-1 compilation model (spec §3.2, R-2.1.3; ticket S1.10). A PERSISTENT
    # workspace member: the pure, content-addressed pipeline — stage 0 accept (calls
    # validate_assembly; re-asserts the canonical hash), stage 1 link (link_precheck's
    # C-LINK-1 selector refusal — the DF-S1.9-3 consumer; profile-chain binding, debt-record
    # completeness, capability_requires), stage 2 lower-native to the closed RuntimePlan/1
    # node set, stage 5 seal (derivation_key + bundle_id under idp/1, the total trace map,
    # the static lcd_report, E1–E3/E7 equivalence evidence) — plus the hh-compile
    # out-of-process seam (AC-CP-11). Stages 3/4 (lower_profile/lower_target/lift/relower)
    # are S3.2 — not this crate yet.
    "crates/hh-compiler",
    # The C0/Stage-1 reference monitor — the security kernel & capability model
    # (spec §5g.1, R-2.8.1; ticket S1.11). A PERSISTENT workspace member: the
    # kernel-owned AuthorityHandle table projection over
    # security.permission.granted/revoked, root minting ∩ authority_cap, the
    # SurfaceArgMap evaluator, deterministic risk assessment (raise-only),
    # the Π interpreter + default table in both modes, `authorize` steps 0–3
    # and 6, delegation attenuation + revocation cascade, the kernel
    # context_label stamp, the HandleLeak checks, the no-Text/no-model-call
    # static + runtime protections. MUST-code (the TCB); never model-facing.
    "crates/hh-monitor",
    # The C0/Stage-1 containment floor (spec §5g.4, R-2.8.4; ticket S1.12). A
    # PERSISTENT workspace member: the typed, provenance-bearing,
    # content-addressed ContainmentPolicy/1 record (one schema — CC7), the
    # deny-by-default kernel policy + KERNEL_PROTECTED, the authority-ordered
    # layered meet `effective()` with ContainmentWidening, the `admits` floor,
    # the ContainmentReport/evidence model, the EP2 model backend + probe
    # battery, and `attach`'s fail-closed / warn_and_degrade paths. Identity
    # through hh-identity (CC1); no second canonicalization scheme.
    "crates/hh-containment",
    # The C0/Stage-1 credential broker — secret channels, binding & redaction
    # (spec §5g.3, R-2.8.3; ticket S1.13). A PERSISTENT workspace member: the
    # value-free `SecretRef`/`SecretChannel`/`ProvidedSecret` records, the
    # kernel-side `CredentialBroker` verbs (the failure-typed contract — the
    # monitor decides, the broker delivers), the deny-by-default `EnvSpec`
    # projection (placeholders only, the kernel-non-inheritable list), source
    # redaction + the known-value mask set (every live channel, every rotated
    # revision), the `security.credential.*`/`security.secret.*` payload
    # builders, and the SV-1…SV-10 invariants as static/contract tests. MUST-code
    # (the TCB); never model-facing; the Stage-2 egress mediator executes the
    # staged deliveries this crate audits (DF-S1.12-1 → S2.4).
    "crates/hh-secrets",
    # The C0/Stage-1 telemetry backbone — measurement points, views, sinks and
    # propagation (spec §5h.1, R-2.9.1; ticket S1.14). A PERSISTENT workspace
    # member: the closed M1–M19 measurement-point table with the M1–M12 scope
    # kinds wired to the ledger classes, the `trace_view`/`cost_view`/
    # `metric_view` projections (pure folds over the durable prefix — never a
    # second store, ADR-0042 D1/D2), `TokenVector` normalization +
    # `normalizer_ref`, `MeasuredAt`/`clock_tolerance_ms`/`clock_skew_flag`,
    # `SinkPolicy` + the L0–L3 content classes, `export()` with the recorded
    # `TelemetryLossReport`, `PropagationContext` at the subprocess seam, the
    # process-metric catalogue + `registry_check` (the DF-S1.5-2 consumer), and
    # the `measurement.export.delivered`/`measurement.metric.emitted` payload
    # builders. Views stamp through `hh-ledger`'s `View` (one shape, CC7).
    "crates/hh-telemetry",
    # The C0/Stage-1 execution-environment abstraction + sandboxed tool
    # execution (spec §5a.5/§5d.5, R-2.2.5/R-2.5.5; ticket S1.16). A PERSISTENT
    # workspace member: `EnvironmentRecord` under idp/1 (pinned image digest /
    # foreign_digest / UnresolvedRef on tags), the `EnvHandle` declared→ready→
    # torn_down machine, fail-closed `attach` through hh-containment (the
    # DF-S1.12-3 seam), `env_apply` placeholders, the fs.*/upload/download/
    # path_baseline effect surface under R-NOSIDE/R-NONET, the three kernel-
    # clock counters, the seven-stage dispatcher (resolve→authorize→prepare→
    # commit→execute→capture→observe), ExecutorDeclaration/bind, the
    # in-process LocalExecutor + helper-protocol schema, CaptureItem +
    # content-addressed manifest, AttributionToken mint/resolve/hash, the
    # closed ErrorClass sum with the three-origin rule + kernel-derived
    # retryability. The integration layer above hh-hir/hh-containment/
    # hh-monitor/hh-ledger/hh-secrets/hh-budget — the cycle-safe seam (CC7).
    "crates/hh-env",
    # The C0/Stage-1 model adapter / gateway + C0 model-plane slices (spec
    # §5b.1–§5b.4, R-2.3.1, the R-2.3.2 C0 static slice, R-2.3.3⁰, R-2.3.4⁰;
    # ticket S1.18; ADR-0118…0128). A PERSISTENT workspace member: the
    # model-blind, dialect-parameterised gateway — WireDialect/1 descriptors
    # (debt-recorded rules), the normalized ModelEvent grammar (G1–G7) +
    # ModelMessage (T1–T7), closed StopReason/ModelErrorClass with kernel
    # retry_class defaults, AttemptPolicy as data + R-RT-1…6, usage on
    # model.call.completed through hh-telemetry's TokenVector, kernel-held
    # credentials (provided: yes/no only), the H4 endpoint allow-list refusal;
    # the C0 static router slice (ModelRoleTable, RoutingPolicy{static,
    # role_table}, guards G-1/G-2/G-4, the closed RoutingRefusal sum,
    # model.route.decided); the §5b.4⁰ slice — CacheSemantics as data,
    # LC-1…LC-9 layout invariants, the affinity key, expected/observed state,
    # model.cache.resolved. Consumes hh-compiler's ModelProfile/1 (CC1 — never
    # a duplicate record) and appends through the run's fenced writer.
    "crates/hh-gateway",
    # The C0/Stage-1 context builder / policy engine + C0 memory slices (spec
    # §5c.1/§5c.3/§5c.4, R-2.4.1, R-2.4.3⁰, R-2.4.4⁰; ticket S1.19;
    # ADR-0072…0083). A PERSISTENT workspace member: the content-addressed
    # `ContextPlan` and its candidate/slot/budget schemas, the six kernel-
    # reserved slots and floors with `InvalidLayout`/`VolatileInStaticTier`
    # at link, the `default` policy + the no-widen policy seam
    # (`PolicyViolation`), the fixed kernel step order with `ContextWindowExceeded`
    # → `CompactionRequired` handled as stop at Stage 0/1, `context.assembled`
    # emission; the C0 `MemoryStore` (`put`/`bind`/`revoke`/`resolve`/`manifest`/
    # `enumerate`/`stale_candidates`) over immutable memory versions with
    # scope-lease fencing, `lexical_index` + `memory_stale_index` materialized
    # views stamped through `hh-ledger`'s `View` (one shape, CC7), deterministic
    # `retrieve` under the fixed validity→authority→readers→rank order; the
    # R-2.4.4⁰ lifecycle pure functions E1–E4 (`lifecycle_state`,
    # `check_contract`, `filter_for_slot`, `write`), deterministic conflict sets,
    # `promote`/`revalidate`. Consumes `hh-hir`'s `ContextItem`/`Memory`/
    # `Artifact` records (never duplicated — CC7) and appends through the run's
    # fenced writer.
    "crates/hh-context",
    # The C0/Stage-1 verification-plane substrate (spec §5f.2/§5f.1/§5f.4,
    # R-2.7.2a, R-2.7.1⁰, R-2.7.3⁰; ticket S1.21; ADR-0109…0117). A PERSISTENT
    # workspace member: the claim-ledger substrate (Claim/AuthoritativeHandle/
    # ReconciliationRecord/SeverityRecord + the bind table + the pure
    # ledger_only fold), the gate substrate (ValidatesRecord/TaskContract/
    # VerificationSummary/GateResult, Γ with kernel floors F2–F7 as constants,
    # validate_gamma, evaluate_gate), the verification fabric
    # (ValidatorDeclaration + declare/bind, Verdict/Finding, kernel local
    # checks (a)–(c), EvidenceBundle/inputs_digest/ClaimOnlyEvidence), the
    # critic slice (CriticDeclaration/IndependenceVector + per-use minimums/
    # CriticVerdict/CalibrationRecord/ProgrammaticCritic), the verification.*
    # payload builders and the ADR-0114 deterministic metric register. The
    # wired gate, live D2/D3/D5/D6 detectors, judged validators/critics and
    # probe/resume halves are Stage 2/3/4 (DF-S1.21-*).
    "crates/hh-verification",
    # The C0/Stage-1 Lab schema plane (spec §6, R-2.9.4⁰ᵃ/2.9.8⁰/2.10.3⁰ᵃ/2.10.4⁰ᵃ +
    # the R-2.10.5⁰ row-key fields; ticket S1.24; ADR-0142…0144, 0154…0160,
    # 0197/0198, 0202/0203). A PERSISTENT workspace member: the benchmark/
    # environment records (`EnvironmentFamilyRecord`, `TaskRecord`,
    # `SuiteManifest`, `SuiteValidityRecord`, `SplitAssignmentRecord`,
    # `ParityReport`) with the import-side checks (disjoint surfaces,
    # `HeldOutInEnvironment`); the foreign-model claim records (`ForeignRef`,
    # `SnapshotClaim`, `TrainingCutoffClaim`, `CompatibilityRecord`); the
    # experiment dialect `hh-experiment/1` (`ExperimentSpec`, `FactorSpec`,
    # `LevelSpec`, `ArmSpec`, `SuiteBinding`, `SchedulingPolicy`,
    # `ReattemptPolicy`, `ValidationStrategy`, `CellPlan`/`RunPlan`/`OrderPlan`,
    # `run_plan_id`, the closed `ExperimentRefusal` register set); the analysis
    # records (`AnalysisSpec`, `AnalysisRecord`, `AnalysisReport`,
    # `ComparisonReport`, `RenderSpec`); and the debt views (`DebtIndexRow`,
    # `DebtReport`, `DebtNotice`). Engines/samplers land at Stage 3.
    "crates/hh-lab",
    # The hh-embed/1 embedding boundary (spec §7.4, R-2.11.4⁰ᵇ; ticket S1.25) — EmbedService
    # (binding a) + the stdio loop (binding b) over Store/EnvDriver/Driver; the kernel binary
    # delegates to it. A PERSISTENT workspace member.
    "crates/hh-embed",
    "crates/hh-kernel",
    # The C0/Stage-1 extensibility / plugin architecture (spec §8.4, R-2.12.2;
    # ticket S1.27; ADR-0180…0182). A PERSISTENT workspace member: ContractRef /
    # ContractVersionPolicy / check_compatibility (the pre-load refusal — AC-2),
    # the tier/depends_on declarations + spec_dag_check over the §4.4 tables
    # parsed as data (AC-8), the module-graph lint for first-party in-process
    # variants (AC-9), the golden-manifest corpus driver, and the
    # hh-plugin-check readiness binary. The PluginManifest/1 codec + admission
    # live in hh-registry::extension::plugin; the plugin_abi/1 schema lives in
    # hh-embed-schema::plugin_abi (one schema source — CC7/V6).
    "crates/hh-plugin",
    "crates/hh-codegen",
    "crates/hh-embed-client-generated",
    # The C0 attended CLI slice (spec §7.1, R-2.11.1⁰ᵇ; ticket S1.26;
    # ADR-0167/0168/0169). A PERSISTENT workspace member: the `hh` binary — a generated
    # client and renderer over hh-embed/1 (attended terminal mode, per-effect approvals,
    # `approval *`, run resume/fork/cancel/inspect, the attendance declaration, I-1,
    # exhaustion escalate/stop, the full exit-class table, `json`/`jsonl`, stdin typing,
    # InvocationRecord + idempotency). Depends only on the generated client
    # (AC-R-2.11.1-1); no kernel semantics live here (K-2) — every command is one typed
    # boundary operation sequence.
    "crates/hh-cli",
    # `crates/hh-baseline` (the THROWAWAY Stage-0 baseline, doc 3 §11.0; ticket S0.2)
    # was deleted at S1.20 — the canonical `hh-control` lands the full control
    # strategy + envelope and the baseline's throwaway `StopReason` subset retired
    # with it (CC1; nothing persistent depended on it).
]
# Throwaway spike trees (ADR-0050 R1–R6; doc 3 §11.0) live outside the workspace: they build
# against the persistent kernel but are never a build dependency of it.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"

[profile.release]
opt-level = 3
