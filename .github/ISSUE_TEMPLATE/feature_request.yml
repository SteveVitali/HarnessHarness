name: Feature request
description: Propose a capability, contract change, or tooling improvement
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the system refuses or cannot express today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        The shape you'd want. Note: contract/schema changes are ADR-gated
        (spec/CANONICAL_SPEC.md is frozen — amendments go through the manifest
        protocol), and any new dependency needs its own ADR.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or why existing ops cannot carry it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - kernel / boundary (hh-embed/1)
        - Lab (experiment / eval / bench)
        - services (subagent / orchestrator / fleet / evolution / debt)
        - surfaces (CLI / web / MCP / ACP / plugins)
        - spec / governance / build record
        - tooling / CI
    validations:
      required: true
