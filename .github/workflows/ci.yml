# HarnessHarness CI — the Stage-0 output that persists (ADR-0050 (e)).
# Builds/tests the E1 workspace and enforces the schema-drift check (CC7: schema drift is a
# build failure). The toolchain is pinned by rust-toolchain.toml; the only fetched crates are
# ADR-0359's `ring` graph (lockfile-pinned — `cargo fetch --locked` below) plus `hharness-varhost`'s
# `tempfile` dev-dep; everything else is pure standard library.
#
# R4.2a / ADR-0362 step-mode convention: the `id: path` decision step classifies
# the head `fast` (docs-only, covered by an unexpired same-repository anchor) or
# `full` (the fail-closed default). Every later step either carries
# `if: steps.path.outputs.mode != 'fast'` or a `# ci-mode: both — <reason>`
# comment — a step that reads committed content under docs/ or research/ is never
# gated (a job's own output written there is not a read). check-ci-gating.sh
# enforces this file's convention.
#
# L4.3 (R-2.12.4 supply-chain half / ADR-0378): ubuntu + macOS matrix — the
# helper's seatbelt backend is macOS-native; each leg runs the fast-path
# decision and uploads its own `$RUNNER_OS`-named anchor. The supply-chain
# jobs (cargo-deny, gitleaks) are separate jobs that run on every head and are
# declared before `build-test-drift` — the step-mode lint requires the anchor
# pair to be this file's last two steps. Every `uses:` is pinned by commit SHA
# (the `# v…` comment names the version dependabot tracks).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'x' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The supply-chain jobs run on every head: gitleaks scans docs/ history (a
  # docs reader is never gated) and cargo-deny audits the lockfile — neither
  # sits behind the fast-path decision, which lives inside build-test-drift.
  cargo-deny:
    name: cargo-deny (licenses · advisories · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install cargo-deny (pinned 0.20.2)
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check (deny.toml)
        run: cargo deny check

  gitleaks:
    name: gitleaks (full history + PR diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # --log-opts=--all needs every commit.
          fetch-depth: 0
      - name: Install gitleaks (pinned 8.30.1 + sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version
      # CC1 — the one committed config, shared with live-verify.sh's
      # staged gate; the test-fixture allowlists live there only.
      - name: Full-history scan (.gitleaks.toml)
        run: gitleaks git --redact --log-opts=--all -c .gitleaks.toml .
      - name: PR diff scan
        if: github.event_name == 'pull_request'
        run: gitleaks git --redact -c .gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..HEAD" .

  build-test-drift:
    name: build · test · fmt · drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ci-mode: both — the fast-path machinery's and the live-evidence
      # runner's self-tests run on every head, so the machinery itself can
      # never ship broken on a fast path.
      - name: CI scripts self-test
        run: |
          bash scripts/ci/test-fast-path.sh
          bash scripts/ci/test-check-ci-gating.sh
          bash scripts/ci/test-full-run.sh
          bash scripts/ci/test-live-verify.sh
          bash scripts/ci/test-live-verify-workflow.sh
          bash scripts/ci/test-check-living-docs.sh
          bash scripts/ci/test-gen-revisit-triggers.sh
          bash scripts/ci/test-publish-order.sh

      # ci-mode: both — the step-mode lint reads this file and the working tree.
      - name: CI step-mode lint
        run: |
          bash scripts/ci/check-ci-gating.sh .github/workflows/ci.yml
          bash scripts/ci/check-live-verify-workflow.sh

      # ci-mode: both — the guard reads committed living human-facing files
      # (markdown, manifests, workflows), which a docs-only head can change;
      # the provenance trees (docs/build, docs/tickets, docs/adr, research/)
      # are exempt by the launch ruling. Placed before `id: path` so the
      # check can never sit behind the gate.
      - name: Living-docs personal-path guard
        run: bash scripts/check-living-docs.sh

      - name: Docs-only fast-path decision
        id: path
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_ANCHOR_JOB: build-test-drift
        run: |
          decide_out=$(bash scripts/ci/fast-path.sh decide) || decide_out=full
          mode=$(tail -n 1 <<<"$decide_out")
          [ "$mode" = fast ] || mode=full
          printf '%s\n' "$decide_out" | grep '^::notice' || true
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml pins the channel + rustfmt; this action honors it.
      - name: Install pinned toolchain
        if: steps.path.outputs.mode != 'fast'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.94"
          components: rustfmt

      # L4.3: the R4.5 E2/E3 foreign legs run on both matrix legs — E3 needs
      # node >= 22 (runner images carry older majors), E2 needs python3.
      - name: Install node 22 (E3 foreign leg)
        if: steps.path.outputs.mode != 'fast'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install python 3.13 (E2 foreign leg)
        if: steps.path.outputs.mode != 'fast'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Format check
        if: steps.path.outputs.mode != 'fast'
        run: cargo fmt --all --check

      # ADR-0359: the one admitted registry read, made explicit + locked.
      - name: Fetch pinned dependencies
        if: steps.path.outputs.mode != 'fast'
        run: cargo fetch --locked

      # L4.1 (R-2.12.4 licensing leg): every workspace package licensed
      # "MIT OR Apache-2.0" + the notices file regenerated drift-free.
      # Reads manifests/lockfile only — gated like the other build legs.
      - name: License metadata + third-party notices check
        if: steps.path.outputs.mode != 'fast'
        run: |
          bash scripts/check-licenses.sh
          bash scripts/gen-third-party-notices.sh --check

      - name: Build
        if: steps.path.outputs.mode != 'fast'
        run: cargo build --workspace --all-targets

      - name: Test
        if: steps.path.outputs.mode != 'fast'
        run: cargo test --workspace

      # L4.7: the README's hermetic quickstart block executed verbatim
      # from a clean clone of this head (clone → build → doctor → a
      # scripted-lane run). Reads only README.md at the repo root —
      # gated like the other build legs; one matrix leg suffices.
      - name: Quickstart (clean clone, verbatim)
        if: steps.path.outputs.mode != 'fast' && matrix.os == 'ubuntu-latest'
        run: bash scripts/check-quickstart.sh

      - name: Schema drift check (CC7)
        if: steps.path.outputs.mode != 'fast'
        run: bash scripts/check-drift.sh

      # L4.3 / MINOR-2: rustdoc warnings are build noise the public repo
      # cannot carry; one matrix leg suffices.
      - name: Rustdoc warnings gate
        if: steps.path.outputs.mode != 'fast' && matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

      # L4.5 / ADR-0380 (b): the workspace is checked at exactly the declared
      # `rust-version` — the manifest's claim is verified, never asserted.
      # One matrix leg suffices (check is host-independent).
      - name: MSRV check (declared rust-version)
        if: steps.path.outputs.mode != 'fast' && matrix.os == 'ubuntu-latest'
        run: |
          MSRV="$(sed -n '/\[workspace\.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$MSRV" ] || { echo "workspace rust-version unreadable"; exit 2; }
          echo "declared rust-version: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          cargo +"$MSRV" check --workspace --all-targets

      # L4.5 / ADR-0380 (a): every publishable crate carries the full
      # crates.io metadata set; the publish=false set matches the ADR's
      # record exactly. Reads manifests + cargo metadata — gated like the
      # build legs. One matrix leg suffices.
      - name: Publish metadata check
        if: steps.path.outputs.mode != 'fast' && matrix.os == 'ubuntu-latest'
        run: bash scripts/check-publish-metadata.sh

      # L4.5 / ADR-0380 (d): every publishable crate documents clean under
      # its declared docs.rs settings (`[package.metadata.docs.rs]`).
      - name: docs.rs settings doc check
        if: steps.path.outputs.mode != 'fast' && matrix.os == 'ubuntu-latest'
        run: bash scripts/check-docsrs.sh

      # R4.5 / DF-S0.3-2: E1 self-check + E2 (python3) + E3 (node >= 22)
      # foreign verifies, answers regenerated at run time. Reads crates/ +
      # foreign/ only — gated like the build legs; a toolchain absent on
      # the runner exits 3 (honest red, never a silent skip in CI).
      - name: Cross-implementation foreign replay (E1 + E2 + E3)
        if: steps.path.outputs.mode != 'fast'
        run: bash scripts/xcheck-foreign.sh

      # ci-mode: both — reads committed content under docs/ (DEFERRALS rows and
      # spec sections), so it runs on the fast path too.
      - name: Build-memory row-tool self-test (BM-ORIENT-01)
        run: bash scripts/check-bm-tools.sh

      # ci-mode: both — validates committed hh-live-evidence/1 records under
      # docs/build/reports/live/; a docs-only head that touches them must not
      # skip this check (ADR-0363 D9).
      - name: Live-evidence validator (hh-live-evidence/1)
        run: bash scripts/check-live-evidence.sh

      # ci-mode: both — the generated catalogue reads committed docs/adr
      # `## Revisit trigger` sections + docs/build/BACKLOG.csv; a docs-only
      # head that adds or re-homes a trigger must not skip this check (L4.2).
      - name: Revisit-trigger catalogue drift check (L4.2)
        run: bash scripts/gen-revisit-triggers.sh --check

      - name: S2 boundary spike (AC-R-2.11.4-9 first measurement, non-gating)
        # Non-gating by design (this is an internal tier-B measurement, not a gate
        # threshold — see the step name and the generated sheet's header). The step
        # was missing `continue-on-error`, so a spike-only failure (e.g. the
        # throwaway spike binary lagging a generated-client API change) still failed
        # the whole job. Honor the documented intent: a spike failure is reported but
        # does not gate CI. R4.2a / ADR-0362 (D3): the spike runs only on
        # workflow_dispatch full runs.
        if: steps.path.outputs.mode != 'fast' && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash scripts/spike-s2-boundary.sh

      - name: Upload boundary measurement sheet
        if: steps.path.outputs.mode != 'fast' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s0.1-boundary-spike
          path: docs/build/reports/S0.1-boundary-spike.md
          if-no-files-found: warn
          overwrite: true

      - name: Compute anchor
        id: anchor
        if: success() && steps.path.outputs.mode == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_ANCHOR_JOB: build-test-drift
        run: |
          bash scripts/ci/fast-path.sh record ci-anchor.txt > anchor-name.txt
          echo "name=$(cat anchor-name.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload anchor
        if: success() && steps.path.outputs.mode == 'full' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.anchor.outputs.name }}
          path: ci-anchor.txt
          retention-days: 14
          overwrite: true
          if-no-files-found: error
