title = "HarnessHarness gitleaks config — R4.5a / ADR-0363 (D8)"

# Extends the gitleaks default rule set. The staged-diff gate
# (`scripts/live-verify.sh`) and the one-off full-history baseline both run
# with this config; L4.3 reuses it in CI (CC1 — one config).

[extend]
useDefault = true

# Full-history baseline (`gitleaks git --redact --log-opts=--all`, run
# 2026-10-21, 627 commits): exactly 7 findings, all `generic-api-key`, all
# the committed *fake* fixture literals below — each allowlisted by
# path+rule. Any baseline hit outside this set is a real finding: STOP,
# rotate the credential, ask the operator.

[[allowlists]]
description = "fake ghp_live…/sk-live-… literals planted as known-value/canary fixtures for hharness-secrets detector tests (acceptance.rs:245,377,593 at b97b2bc) — synthetic, never real credentials"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-secrets/tests/acceptance\.rs$''']

[[allowlists]]
description = "fake credential literals in the SV security-verification battery fixtures (sv.rs:553,867,908 at b97b2bc) — synthetic, never real credentials"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-secrets/tests/sv\.rs$''']

[[allowlists]]
description = "fake credential literal in the hharness-telemetry acceptance fixtures (acceptance.rs:220 at 0932916) — synthetic, never a real credential"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-telemetry/tests/acceptance\.rs$''']

[[allowlists]]
description = "TEST-ONLY throwaway PKI fixture keys under crates/hh-tls/fixtures/pki (regenerated by scripts/gen-test-pki.sh, R4.5c/ADR-0365) — synthetic, marked test-only, never real credentials"
condition = "AND"
rules = ["private-key"]
paths = ['''^crates/hh-tls/fixtures/pki/''']

[[allowlists]]
description = "round-5 SETUP: generic-api-key false positives on English prose in frozen/reviewed documents — 'token totals, ancestor…' (planning invariants I-04) and 'missing keys, short/…' (ratified spec §4). Scoped to the planning commit's frozen bytes; any new hit on these paths or commits still reports"
condition = "AND"
commits = ["1667c5e448af0b41c3e9cecbb981e0a6207897df"]
rules = ["generic-api-key"]
paths = ['''^docs/build/planning/2026-10-30_evidence-invariants\.md$''', '''^docs/evidence-and-adoption-spec\.md$''']
