title = "HarnessHarness gitleaks config — R4.5a / ADR-0363 (D8)"

# Extends the gitleaks default rule set. The staged-diff gate
# (`scripts/live-verify.sh`) and the one-off full-history baseline both run
# with this config; L4.3 reuses it in CI (CC1 — one config).

[extend]
useDefault = true

# Full-history baseline (`gitleaks git --redact --log-opts=--all`, run
# 2026-10-21, 627 commits): exactly 7 findings, all `generic-api-key`, all
# the committed *fake* fixture literals below — each allowlisted by
# path+rule. Any baseline hit outside this set is a real finding: STOP,
# rotate the credential, ask the operator.

[[allowlists]]
description = "fake ghp_live…/sk-live-… literals planted as known-value/canary fixtures for hharness-secrets detector tests (acceptance.rs:245,377,593 at b97b2bc) — synthetic, never real credentials"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-secrets/tests/acceptance\.rs$''']

[[allowlists]]
description = "fake credential literals in the SV security-verification battery fixtures (sv.rs:553,867,908 at b97b2bc) — synthetic, never real credentials"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-secrets/tests/sv\.rs$''']

[[allowlists]]
description = "fake credential literal in the hharness-telemetry acceptance fixtures (acceptance.rs:220 at 0932916) — synthetic, never a real credential"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-telemetry/tests/acceptance\.rs$''']

[[allowlists]]
description = "fake Ollama key literal sk-ollama-fixture-leak-12345 planted as the leak_scan canary in the R6.10 proxy battery (r6_10.rs:493 at 1f582c56) — synthetic, never a real credential"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^crates/hh-hosting/tests/r6_10\.rs$''']

[[allowlists]]
description = "TEST-ONLY throwaway PKI fixture keys under crates/hh-tls/fixtures/pki (regenerated by scripts/gen-test-pki.sh, R4.5c/ADR-0365) — synthetic, marked test-only, never real credentials"
condition = "AND"
rules = ["private-key"]
paths = ['''^crates/hh-tls/fixtures/pki/''']

[[allowlists]]
description = "round-5 SETUP: generic-api-key false positives on English prose in frozen/reviewed documents — 'token totals, ancestor…' (planning invariants I-04) and 'missing keys, short/…' (ratified spec §4). Scoped to the planning commit's frozen bytes; any new hit on these paths or commits still reports"
condition = "AND"
commits = ["1667c5e448af0b41c3e9cecbb981e0a6207897df"]
rules = ["generic-api-key"]
paths = ['''^docs/build/planning/2026-10-30_evidence-invariants\.md$''', '''^docs/evidence-and-adoption-spec\.md$''']

[[allowlists]]
description = "R5.5 dossier: generic-api-key false positives on English prose — 'missing keys, short/…' refusal vocabulary echoed verbatim from ratified spec §4.3 into the rows 4–7 packets. Scoped to this ticket's impl commit + path; any new hit on this path or another commit still reports"
condition = "AND"
commits = ["0f1ac7760b647df5f9ba7b0064cd82ec148a1a22"]
rules = ["generic-api-key"]
paths = ['''^docs/build/planning/2026-10-30_amendment-dossier\.md$''']

[[allowlists]]
description = "R6.2 provenance archive: generic-api-key false positive on verbatim container pull output — the fix-git h-side record carries podman 'Copying blob sha256:' digests inside the task's real build stdout, not a credential. Scoped to this commit + path; any new hit on this path or another commit still reports"
condition = "AND"
commits = ["33aec747f99ca880e1db40b80a645d576990d644", "39fb3f23e5aea6790342920b5d5e41a75c6cdc6a"]
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/provenance/2026-11-06-scratch-drivers/raw/parity-tranche-3/h-side/fix-git\.h-side\.json$''']

[[allowlists]]
description = "kernel MPTCP boot-autogenerated token in harvested GCE guest logs (`autogenerated kernel key: <hex>`) — a public per-boot value the kernel logs on every Linux boot, not a credential; scoped to committed harvest log paths only"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/compute/harvest/.*\.(log|txt)$''']

[[allowlists]]
description = "R6.42 fp-partition/dev-projection records: generic-api-key false positives on `partition_key` members — 64-hex sha256 partition digests over canonical member lists, not credentials. Scoped to this ticket's commits + paths; any new hit on these paths or another commit still reports"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-11-fp-partition\.json$''', '''^docs/build/reports/2026-11-11-fp-dev-projection\.json$''']

[[allowlists]]
description = "R7.3 p4x0 window record: generic-api-key false positives on `order_key` members — 64-hex sha256 deterministic schedule-ordering digests (same member shape as committed fp-w4/fp-w4x window records), not credentials. Scoped to this file; any new hit elsewhere still reports"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-21-fp-p4x0-window\.json$''']

[[allowlists]]
description = "R6.52c order_key scheduling SHA-256 digests recomputed from public seed/task/replicate, not credentials; exact introducing commit, file and field format only"
condition = "AND"
commits = ["b2a469ae3c891e7246f1dba1085bde5c68e1646c"]
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-19-fp-w4-window\.json$''']
regexTarget = "match"
regexes = ['''^order_key": "[0-9a-f]{64}"$''']

[[allowlists]]
description = "R6.53/R6.55/R7.3 order_key schedule-ordering SHA-256 digests, not credentials; exact commits, files, field format"
condition = "AND"
commits = ["c89fbf94e4fe3efa845a517fa62c82a6584c800b", "5a7c936fa722f873bc261d564e99efc99bb52457", "22ce1eb0dfe5d2da8d6e4d3dedb5e8b56811c17e"]
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-20-fp-w4x-window\.json$''', '''^docs/build/reports/2026-11-20-fp-w4xv-window\.json$''', '''^docs/build/reports/2026-11-21-fp-p4x0-window\.json$''']
regexTarget = "match"
regexes = ['''^order_key": "[0-9a-f]{64}"$''']

[[allowlists]]
description = "sanitize-git-repo benchmark fixture: planted fake AWS keys echoed in recorded pytest output, not project credentials; exact commits, files, match format"
condition = "AND"
commits = ["5a7c936fa722f873bc261d564e99efc99bb52457", "f4f8484fd7b3df8b499e3edb705b925348b6da3a", "bde82fa512d16626e8655bb731cd1a002c01ca08"]
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-20-fp-w4xv-window\.json$''', '''^docs/build/reports/2026-11-20-fp-w4x-outcomes\.json$''']
regexTarget = "match"
regexes = ['''^(?i:aws_secret_access_key)=[A-Za-z0-9]{20,40}'$''']

# Operator 2026-11-23 ("use your best judgement"): real but dead replay-mode loopback slot tokens; history allowlisted (no rewrite), forward fix owed on the R6.55 branch.
[[allowlists]]
description = "R6.55 PP0 replay-mode loopback session records: proxy slot tokens (process-lifetime, 127.0.0.1, replay — no upstream spend); exact commits, files, field format"
condition = "AND"
commits = ["83bb042809b2a6a7543d6a244acfad386b3ae91e", "612698557665a9ae06633dd8f31edb0f10d74b67"]
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-20-r6\.55-w4x-pp0(-r2)?/SM-[a-z0-9]+/session\.json$''']
regexTarget = "match"
regexes = ['''^slot_token": "[0-9a-f]{32}"$''']


[[allowlists]]
description = "R7.5/R7.6 p4c window records: generic-api-key false positives on `order_key` members — 64-hex sha256 deterministic schedule-ordering digests (same member shape as committed fp-w4/fp-w4x/fp-p4x0 window records), not credentials. Scoped to these files + the exact field format; any new hit elsewhere still reports"
condition = "AND"
rules = ["generic-api-key"]
paths = ['''^docs/build/reports/2026-11-26-fp-p4c-window\.json$''', '''^docs/build/reports/2026-11-26-fp-p4c-window-r4\.json$''', '''^docs/build/reports/2026-11-26-fp-p4c-window-r2-attempt1-native_lane_hold\.json$''']
regexTarget = "match"
regexes = ['''^order_key": "[0-9a-f]{64}"$''']
