[package]
name = "hh-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Stage-3 fixture MCP surface (spec section 7.3, R-2.11.3^0; ticket S3.1; ADR-0097 D7/ADR-0173/0174). The hh-mcp-target/1 served-artifact record, the compiled-bundle -> canonical tool-catalogue lowering (byte-identical for every connection of one bundle), the stdio_launch CallerBinding record fixed to the test principal, and the newline-JSON-RPC serve loop the hh-mcp-serve binary wraps. A pure function of (artifact, binding): no ledger, no kernel link, no authority from caller _meta."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hh-mcp-serve"
path = "src/bin/hh-mcp-serve.rs"

[dependencies]
hh-wire = { path = "../hh-wire" }
hh-identity = { path = "../hh-identity" }
# The binary decodes `hh-bundle/1` directories/containers (the lib's
# lowering is over member bytes only — the dep serves `hh-mcp-serve`).
hh-bundle = { path = "../hh-bundle" }
# S4.5b — the `McpExecutor` is a `ToolExecutor`; `hh-hir`/`hh-containment`
# name its declaration's domains/isolation.
hh-env = { path = "../hh-env" }
hh-hir = { path = "../hh-hir" }
hh-containment = { path = "../hh-containment" }

[dev-dependencies]
# The paused-arm integration fixture (DF-S3.9-1): a real Dispatcher over a
# scripted transport needs the same crates hh-env's own acceptance tests use.
hh-compiler = { path = "../hh-compiler" }
hh-context = { path = "../hh-context" }
hh-ledger = { path = "../hh-ledger" }
hh-monitor = { path = "../hh-monitor" }
hh-ontology = { path = "../hh-ontology" }
hh-provenance = { path = "../hh-provenance" }
hh-secrets = { path = "../hh-secrets" }
