description = "The C0/Stage-1 configuration & composition model (spec §3.3, R-2.1.4): the assembly grammar in the HIR/1 schema, the class catalog for control_strategy and context_policy over the registry's ClassRecord/VariantRecord, load, validate_assembly (stages 1–5 and 7, complete reports, never fail-fast), resolve (one resolver feeding seal), identity, diff via HirDiff, in-process instantiate with lifecycle.component.bound, verify_resume with lifecycle.definition.changed, and the closed AssemblyDiagnostic taxonomy. Reuses the one HIR (hharness-hir), identity (hharness-identity), provenance (hharness-provenance), registry store (hharness-registry) and event store (hharness-ledger). compose (layers + monotone authority_cap), space/enumerate + the ADR-0025 override grammar and stage 6a are Stage 3; stage 6b is C1/Stage 5 — not yet."

