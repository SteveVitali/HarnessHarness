description = "The C0/Stage-1 verification-plane substrate (spec §5f, R-2.7.2a, R-2.7.1⁰, R-2.7.3⁰; ticket S1.21; ADR-0109…0117). The claim-ledger substrate — `Claim`/`ClaimKind`/`SubjectRef`, `extract`/`validate` (`AuthorityExceedsOrigin`), `AuthoritativeHandle` + the `ClaimKind × subject` bind table, `ReconciliationRecord`/`Agreement`/`DivergenceClass` (D1–D10), `GateResult` + the kernel floors, `validate_gamma` refusal on floor-loosening — and the fabric's C0 slices: `ValidatorDeclaration`, `Verdict`/`EvidenceHandle`/`EvidenceBundle`, `ClaimOnlyEvidence`/no-rewrite rules, `ValidatesRecord`/`TaskContract`/`VerificationSummary` + `HeldOutLeak` — and the critic slice: `CriticDeclaration`, `IndependenceVector`, `CriticVerdict`/`CalibrationRecord`, `ProgrammaticCritic`, the `verification.*` builders + the ADR-0114 metric register. Wired gate evaluators, live detectors, judged critics and probe/resume are staged to Stage 3+ (DF-S1.21-*)."

