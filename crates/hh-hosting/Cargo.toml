description = "The hh-hosting/1 Hosting ABI schema slice (spec §6.6, R-2.10.6⁰; ticket S3.4d; ADR-0164/0165/0166 (e)): the HostedEvent envelope with I-1…I-5 validation, proj_ABI (native-ledger → hosted presentation driven by hharness-ledger's hosted_lowering column), the lift back into native-class rows with a declared LoweringLossReport, the ParticipantRecord/AdapterRecord schemas (hh.hosting/1 ext block), and adapter zero — the deterministic reference-harness fixture. Schemas and a fixture over native runs only; the hosting service (handshake, verbs, probes, quarantine) lands at S4.5a."

