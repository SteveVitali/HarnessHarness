[package]
name = "hh-hosting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The hh-hosting/1 Hosting ABI schema slice (spec §6.6, R-2.10.6⁰; ticket S3.4d; ADR-0164/0165/0166 (e)): the HostedEvent envelope with I-1…I-5 validation, proj_ABI (native-ledger → hosted presentation driven by hh-ledger's hosted_lowering column), the lift back into native-class rows with a declared LoweringLossReport, the ParticipantRecord/AdapterRecord schemas (hh.hosting/1 ext block), and adapter zero — the deterministic reference-harness fixture. Schemas and a fixture over native runs only; the hosting service (handshake, verbs, probes, quarantine) lands at S4.5a."

[lib]
path = "src/lib.rs"

[dependencies]
hh-wire = { path = "../hh-wire" }
hh-identity = { path = "../hh-identity" }
hh-provenance = { path = "../hh-provenance" }
hh-ontology = { path = "../hh-ontology" }
hh-hir = { path = "../hh-hir" }
hh-ledger = { path = "../hh-ledger" }
hh-budget = { path = "../hh-budget" }

[dev-dependencies]
hh-telemetry = { path = "../hh-telemetry" }
