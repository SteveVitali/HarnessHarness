[package]
name = "hh-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The C0/Stage-1 event store / run ledger (spec §5a.1, R-2.2.1; ADR-0026/0027/0028/0029): the sole authoritative record of what a run decided, did and observed — a typed append-only hash-chained event log (the envelope, the id model, the declared persistence-policy table, the C0 class set), the content-addressed blob store, the immutable run manifest, the single fenced writer with lease-generation tokens, durable-before-visible atomic batches, verify → Tampered, subscribe frames, and pure rebuildable projections (context_view, run_summary) stamped (run_id, seq, view_policy_version, view_hash)."

[lib]
path = "src/lib.rs"

[dependencies]
hh-wire = { path = "../hh-wire" }
hh-identity = { path = "../hh-identity" }
hh-provenance = { path = "../hh-provenance" }
# The Lab closed sums (R-2.9.4⁰ᵃ; S1.24) — `TaskRef.split_label` is the typed
# `SplitLabel` closed set, never an open string.
hh-ontology = { path = "../hh-ontology" }
