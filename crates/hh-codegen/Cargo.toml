[package]
name = "hh-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The schema-export → codegen pipeline (ADR-0050 (e), CC7). Reads the single schema source (hh-embed-schema) and emits the checked-in, drift-checked artifacts: the canonical schema export and the generated client bindings."

[[bin]]
name = "hh-codegen"
path = "src/main.rs"

[dependencies]
hh-wire = { path = "../hh-wire" }
hh-embed-schema = { path = "../hh-embed-schema" }
