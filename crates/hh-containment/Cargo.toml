[package]
name = "hharness-containment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The C0/Stage-1 containment floor — ContainmentPolicy/1, KERNEL_PROTECTED, the authority-ordered layered meet, admits(), ContainmentReport, the EP2 model backend + probe battery, and fail-closed attach (spec §5g.4, R-2.8.4; ticket S1.12; ADR-0060/0061/0062)."

[lib]
path = "src/lib.rs"

[dependencies]
hharness-wire = { path = "../hh-wire" }
hharness-identity = { path = "../hh-identity" }
hharness-provenance = { path = "../hh-provenance" }
hharness-hir = { path = "../hh-hir" }
# The spec's own edge direction (R-2.8.4 → R-2.8.1): the crate produces the
# recorded `ContainmentGate` precondition `authorize` consumes and reads the
# canonical-args record the SurfaceArgMap evaluator resolved.
hharness-monitor = { path = "../hh-monitor" }

[dev-dependencies]
hharness-compiler = { path = "../hh-compiler" }
