[package]
name = "hharness-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The C0/Stage-1 control plane (spec §5e.1/§5e.2, R-2.6.1/R-2.6.2; ticket S1.20; ADR-0103…0108). The `control_strategy` contract — the closed `Cue`/`ControlDecision`/`ControlState`/`ControlCapabilities` sums, `open`/`observe`/`decide`/`terminate`/`checkpoint`/`restore`, the `react/minimal` variant with its F1 decision table, the variant registry — and the control envelope: the sealed `EnvelopePolicy` with its guard points as pure folds over the durable prefix, `envelope.check`, the stop protocol with barrier + drain + `DrainReport`, shared attempt identity + deadlines + reservation sizing, INV-1…9 with the quarantine path, the deterministic `loop_detector` ladder (nudge→deny→stop), output validation, and the cue-inbox driver emitting the full `control.decision` audit row with `checkpoint_ref` per decision. The `StopReason`/`StopKind`/`OutcomeClass` vocabulary lives in `hharness_ontology::control` (CC7); the gateway's `StopReason` is a different sum (R-2.3.1)."

[lib]
path = "src/lib.rs"

