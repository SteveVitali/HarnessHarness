[package]
name = "hharness-budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The C0/Stage-1 resource-economics & accounting model (spec §8.2, R-2.1.6): the canonical resource/accounting schema — ResourceQuantity/Vector, usage_mapping lowering to exclusive token roles, Attribution + charged_to, PricingTable + SpendRow provenance (confidence/coverage/derivation), the control.budget.* + measurement.cost.attributed payloads, the hierarchical BudgetTree projection (dynamic containment, slice/pool, reservations, exhaustion rules E1–E5), cost_totals, MatchSpec/search_budget/eval_budget, and the budget_delta governance gate. Sits above ontology/identity/provenance/ledger/hir/wire."

[lib]
path = "src/lib.rs"

