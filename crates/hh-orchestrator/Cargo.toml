[package]
name = "hh-orchestrator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The C3/Stage-4 sub-agent orchestrator class (spec §5e.3, R-2.6.3; ticket S4.6; ADR-0186): the `orchestrator` component class binding the closed `TopologyPreset` catalogue (T0 `single`, T1 `orchestrator_worker`, T2 `pipeline`, T6 `background_detached`; T3/T4/T5/T7 declared and bound by their own tickets), the runtime that executes admitted `delegate` decisions through `hh-subagent`'s `spawn`, wait policies `{all, any, quorum(k)}`, tree-local peer messaging under the sealed `MessagingPolicy`, `detach_to_child` + goal-inbox completion delivery, the mandatory typed `delegation_reason`, and the `lab/delegation-v1` first execution under `MatchSpec{matched_total}`. The one consumer of the C1 slice — independently removable (CC6: nothing below C3 depends on this crate)."

[lib]
path = "src/lib.rs"

[dependencies]
hh-wire = { path = "../hh-wire" }
hh-identity = { path = "../hh-identity" }
hh-provenance = { path = "../hh-provenance" }
hh-ontology = { path = "../hh-ontology" }
hh-hir = { path = "../hh-hir" }
hh-ledger = { path = "../hh-ledger" }
hh-budget = { path = "../hh-budget" }
hh-monitor = { path = "../hh-monitor" }
hh-env = { path = "../hh-env" }
hh-control = { path = "../hh-control" }
hh-subagent = { path = "../hh-subagent" }

[dev-dependencies]
hh-compiler = { path = "../hh-compiler" }
hh-lab = { path = "../hh-lab" }
hh-experiment = { path = "../hh-experiment" }
