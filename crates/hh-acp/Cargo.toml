[package]
name = "hharness-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The ACP session boundary (spec section 5d.4, R-2.5.4 C1; ticket S4.5b): the hh-acp-target/1 session artefact consumed from hharness-compiler (v2 pin + v1 compatibility profile), render_session over the single-source event-class lowering table, permission transport through the kernel's Π seam (never adapter-level approval), the _hh/* method surface + agentCapabilities._meta advertisement, session/resume replay, the binding-(c) attach_session client, and the C2 A2A edge (AgentCard version=bundle_id signed under a TrustRootPolicy, the exhaustive TaskState projection, delegate_task record shapes). Records-in/records-out: no ledger writes, no kernel authority — claims are data, never decisions."

[lib]
path = "src/lib.rs"

[dependencies]
hharness-wire = { path = "../hh-wire", version = "0.1.0" }
hharness-identity = { path = "../hh-identity", version = "0.1.0" }
# `ProtocolBinding` machinery + the pin-set/negotiate sums are shared —
# `hharness-mcp` owns the generic edge vocabulary (never duplicated).
hharness-mcp = { path = "../hh-mcp", version = "0.1.0" }
# The event-class lowering/tool-kind/task-state tables (the single
# source — ADR-0096 D5: projections live in the compiler's module).
hharness-compiler = { path = "../hh-compiler", version = "0.1.0" }
# `FixedSigner`/`KeyTable` for the A2A card signature fixture seam.
hharness-ledger = { path = "../hh-ledger", version = "0.1.0" }
# R2.14 — the propagation carrier's `_meta.hharness` member set is
# hharness-telemetry's single definition (CC1).
hharness-telemetry = { path = "../hh-telemetry", version = "0.1.0" }
