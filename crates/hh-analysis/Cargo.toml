[package]
name = "hharness-analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The C0/Stage-3 §6.4 estimator kernel (R-2.10.4⁰ᵇ; ticket S3.4c; ADR-0157/0158/0159/0160): the pure, versioned, class-aware analyze(spec, rows @ watermark_set) over results rows — A1 summarize, A2 compare (paired Δ, selection rule, permutation test, tail effects, outcome bounds, multiplicity), A3 contrast, A8 equivalence, A12 multiplicity (Holm + BH), transfer rows; the ResultsRow+RunManifest+LedgerFacts→EvalRun projection; AnalysisRecord/analysis_report_body/1 LabDocs persistence (recorded, never recomputed). Reuses hharness-eval's compare/stats/benefits machinery (CC1); owns no store, no scheduler, no oracle."

[lib]
path = "src/lib.rs"

