[package]
name = "hh-baseline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "THROWAWAY Stage-0 de-risking baseline (doc 3 §11.0): a hand-authored react/minimal definition runs one headless coding task end-to-end through a deliberately minimal C0 subset — hand-stamped provenance/identity, one root BudgetNode, a model-blind gateway over one wire dialect with a scripted (offline) stub, one in-process tool executor, a single-file trace, an allow-list, one static role, stdio hello, and the headless CLI driver. Deleted at the Stage-0 boundary; NOT a dependency of the persistent kernel."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hh-baseline"
path = "src/bin/hh-baseline.rs"

[dependencies]
# Reuses the S0.1 persistent transport (canonical JSON, framing) and the single schema
# source's hello/ContractIdentity — never re-established here (CC7). Pure std otherwise
# (offline, hermetic).
hh-wire = { path = "../hh-wire" }
hh-embed-schema = { path = "../hh-embed-schema" }
