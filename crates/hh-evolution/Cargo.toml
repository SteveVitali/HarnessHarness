[package]
name = "hharness-evolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The C5 §05h evolution pipeline (R-2.9.5; ticket S6.1a; ADR-0195/0196): the closed S0–S10 candidate state machine over durable `measurement.evolution.*` rows (one `run_kind = experiment` campaign run, fold-of-the-prefix view), the `EvolutionCampaignSpec`/typed records (hypothesis, screen, search, held-out, transfer, security-invariance, acceptance, retirement), the closed refusal table (S1 static … S10 retire/revalidate), and the campaign driver. Records-in/records-out — the pipeline evaluates no task itself; the experiment engine is the sole evaluation substrate. Reuses hharness-hir, hharness-budget, hharness-lab/hharness-experiment, hharness-ledger — no second store, no second authority path (CC1/CC3/CC10)."

[lib]
path = "src/lib.rs"

