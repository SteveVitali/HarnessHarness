[package]
name = "hharness-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Stage-3 benchmark-adapter contract (R-2.9.4⁰ᵇ; ADR-0142/0143/0144): out-of-process adapters, materialize/expose/collect_submission/grade lifecycle, separate-verifier isolation, infrastructure-failure detection, typed reward parsing, parity reports. Integrates suites, never authors them."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hh-bench-adapter"
path = "src/bin/hh_bench_adapter.rs"

[dependencies]
hharness-wire = { path = "../hh-wire" }
hharness-identity = { path = "../hh-identity" }
hharness-ontology = { path = "../hh-ontology" }
hharness-ledger = { path = "../hh-ledger" }
hharness-lab = { path = "../hh-lab" }
hharness-hir = { path = "../hh-hir" }
hharness-provenance = { path = "../hh-provenance" }
hharness-budget = { path = "../hh-budget" }
hharness-eval = { path = "../hh-eval" }

[dev-dependencies]
# S3.12b (GATE-G2 G2-1): the real-suite legs drive the recorded `model_io`
# corpus through the canonical `hharness-control` Driver (dev-only — the bench
# crate itself never depends on the control plane; CC10/CC6).
hharness-control = { path = "../hh-control" }
hharness-gateway = { path = "../hh-gateway" }
# R2.5 / DF-S1.19-2: the §5c corpus legs (labelled corpora, resume_set,
# environment_epoch providers, conflict fixtures) run the real
# `MemoryStore`/retrieval pipeline over `benchset.stage3.v1` members.
hharness-context = { path = "../hh-context" }
# R2.8 / DF-S1.17-1: the §5d.3 corpus leg — the exposure-metric
# computations (`retrieval_eval` recall@k/nDCG@k over labelled queries the
# recorded `model_io` surfaces label) run the real exposure machinery over
# `benchset.stage3.v1` members (dev-only — the bench crate itself never
# depends on the compiler).
hharness-compiler = { path = "../hh-compiler" }
