[package]
name = "hh-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The C0/Stage-1 compilation model (spec §3.2, R-2.1.3): the pure, content-addressed pipeline — stage 0 accept (calls validate_assembly, re-asserts the canonical hash), stage 1 link (profile chain + target-spec binding, link_precheck's C-LINK-1 selector refusal, debt-record completeness, capability_requires), stage 2 lower-native to the closed RuntimePlan/1 node set, stage 5 seal (derivation_key + bundle_id under idp/1, total trace map, static lcd_report, E1-E3/E7 equivalence evidence). Stages 3/4 (lower_profile/lower_target/lift/relower) are Stage 3 (S3.2) — not this crate yet."

[lib]
path = "src/lib.rs"

[[bin]]
name = "hh-compile"
path = "src/bin/hh-compile.rs"

[dependencies]
hh-wire = { path = "../hh-wire" }
hh-identity = { path = "../hh-identity" }
hh-provenance = { path = "../hh-provenance" }
hh-ontology = { path = "../hh-ontology" }
hh-hir = { path = "../hh-hir" }
hh-assembly = { path = "../hh-assembly" }
hh-registry = { path = "../hh-registry" }
