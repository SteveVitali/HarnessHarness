license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The C4 §5h.6 assumption-debt manager service (R-2.9.6; ticket S6.1b; ADR-0197/0198; ADR-0209 D2): the DebtManagerRecord service record (maturity + the reflexive AssumptionDebtRecord + DebtPolicy.schedule), the durable-prefix ManagerView fold over the registry run's lifecycle.debt.* rows (probation book, scheduled/settled removal tests, sweep watermarks — one authority path), schedule_removal_test under DebtPolicy, retirement_batch designs, the reflexive no_dead_weight_found test, propose_retirement + the retirement gate, and the ledgered probation trigger surface (DF-S5.4-1). Records-in/records-out — the manager never opens a run and never applies a diff to a subject; it authors specs and proposals, folds the durable prefix, and mints lifecycle.debt.* rows. Removable (CC6): only hharness-embed consumes it, under the tier-c4 feature."

