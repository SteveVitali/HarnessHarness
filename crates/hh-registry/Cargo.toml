[package]
name = "hharness-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The C0/Stage-1 component-variation registry store (spec §6.2, R-2.10.2⁰): the closed registry/1 record kinds, the one RegistryEnvelope with its three status axes, the hh/ + local/ namespaces, register/publish/resolve/snapshot/verify/lineage plus the deterministic query/slot_choices/substitutable projections, the ClassRecord/ConformanceSuite records for the two Stage-1 classes, and the lifecycle.registry.* audit events appended through the run's single fenced writer. Reuses the one idp/1 identity/namespace scheme (hharness-identity, CC1), the canonical ProvenanceRecord (hharness-provenance, CC2), and the ledger event store (hharness-ledger). The C1 multi-namespace service is S4.1 — NOT this crate."

[lib]
path = "src/lib.rs"

[dependencies]
hharness-wire = { path = "../hh-wire", version = "0.1.0" }
hharness-identity = { path = "../hh-identity", version = "0.1.0" }
hharness-provenance = { path = "../hh-provenance", version = "0.1.0" }
hharness-ontology = { path = "../hh-ontology", version = "0.1.0" }
hharness-hir = { path = "../hh-hir", version = "0.1.0" }
hharness-ledger = { path = "../hh-ledger", version = "0.1.0" }
hharness-plugin = { path = "../hh-plugin", version = "0.1.0" }
